name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate public repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Validate YAML syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in Path(".").rglob("*.y*ml"):
              if ".git" in path.parts:
                  continue
              with path.open(encoding="utf-8") as stream:
                  list(yaml.safe_load_all(stream))
              print(f"validated {path}")
          PY

      - name: Validate shell syntax
        run: |
          set -euo pipefail
          while IFS= read -r script; do
            bash -n "$script"
          done < <(git ls-files '*.sh')

      - name: Validate GitHub Actions workflows
        run: |
          set -euo pipefail
          for workflow in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$workflow" ] || continue
            python - "$workflow" <<'PY'
          import sys
          from pathlib import Path
          import yaml

          path = Path(sys.argv[1])
          documents = list(yaml.safe_load_all(path.read_text(encoding="utf-8")))
          if len(documents) != 1 or not isinstance(documents[0], dict):
              raise SystemExit(f"invalid workflow document: {path}")
          workflow = documents[0]
          if "jobs" not in workflow:
              raise SystemExit(f"workflow has no jobs: {path}")
          print(f"validated workflow {path}")
          PY
          done
