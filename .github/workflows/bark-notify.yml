name: Notify Bark

on:
  workflow_run:
    workflows: ["Ansible Deploy"]
    types: [completed]

permissions:
  actions: read

jobs:
  notify:
    name: Send build result to Bark
    runs-on: ubuntu-latest
    steps:
      - name: Download build summary
        uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: bark-summary-*
          merge-multiple: true

      - name: Send notification
        env:
          BARK_WEBHOOK_URL: ${{ secrets.BARK_WEBHOOK_URL }}
          RESULT: ${{ github.event.workflow_run.conclusion }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
          FINISHED_AT: ${{ github.event.workflow_run.updated_at }}
        run: |
          set -euo pipefail

          if [ -z "${BARK_WEBHOOK_URL:-}" ]; then
            echo "::error::Missing Actions secret BARK_WEBHOOK_URL"
            exit 1
          fi

          short_sha="${SHA:0:7}"
          repo_name="${REPOSITORY##*/}"
          case "${RESULT}" in
            success)   title="✔ ${repo_name} · 部署成功" ;;
            failure)   title="✘ ${repo_name} · 部署失败" ;;
            cancelled) title="${repo_name} · 部署取消" ;;
            timed_out) title="${repo_name} · 部署超时" ;;
            skipped)   title="${repo_name} · 部署跳过" ;;
            *)         title="${repo_name} · ${RESULT}" ;;
          esac

          start_time="unknown"
          finish_time="unknown"
          duration_text="unknown"
          if start_epoch=$(date -d "${STARTED_AT}" +%s 2>/dev/null) \
            && finish_epoch=$(date -d "${FINISHED_AT}" +%s 2>/dev/null) \
            && [ "${finish_epoch}" -ge "${start_epoch}" ]; then
            start_time=$(TZ=Asia/Shanghai date -d "${STARTED_AT}" '+%F %T')
            finish_time=$(TZ=Asia/Shanghai date -d "${FINISHED_AT}" '+%F %T')
            duration=$((finish_epoch - start_epoch))
            duration_text="$((duration / 60))分$((duration % 60))秒"
          fi

          summary=""
          if [ -s bark-summary-deploy.txt ]; then
            summary=$(<bark-summary-deploy.txt)
          elif [ -s bark-summary-detect.txt ]; then
            summary=$(<bark-summary-detect.txt)
          fi
          if [ -z "${summary}" ]; then
            summary="摘要未生成"
          fi

          body="${WORKFLOW} | ${BRANCH} | ${short_sha}"$'\n'\
            "执行结果: ${RESULT}"$'\n'\
            "开始时间: ${start_time}"$'\n'\
            "结束时间: ${finish_time}"$'\n'\
            "耗时: ${duration_text}"$'\n'\
            "${summary}"
          level="active"
          if [ "${RESULT}" = "success" ]; then
            level="passive"
          fi

          payload=$(jq -n \
            --arg title "${title}" \
            --arg body "${body}" \
            --arg group "GitHub CI" \
            --arg level "${level}" \
            '{
              title: $title,
              body: $body,
              group: $group,
              level: $level
            }')

          curl --fail --silent --show-error \
            --request POST "${BARK_WEBHOOK_URL}" \
            --header "Content-Type: application/json" \
            --data "${payload}"
