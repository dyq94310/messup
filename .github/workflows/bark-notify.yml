name: Notify Bark

on:
  workflow_run:
    workflows: ["Ansible Deploy"]
    types: [completed]

permissions:
  actions: read

jobs:
  notify:
    name: Send build result to Bark
    runs-on: ubuntu-latest
    steps:
      - name: Download build summary
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: bark-summary-*
          merge-multiple: true

      - name: Send notification
        env:
          BARK_WEBHOOK_URL: ${{ secrets.BARK_WEBHOOK_URL }}
          RESULT: ${{ github.event.workflow_run.conclusion }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [ -z "${BARK_WEBHOOK_URL:-}" ]; then
            echo "::error::Missing Actions secret BARK_WEBHOOK_URL"
            exit 1
          fi

          short_sha="${SHA:0:7}"
          title="${REPOSITORY}: ${RESULT}"
          summary=""
          if [ -s bark-summary-deploy.txt ]; then
            summary=$(<bark-summary-deploy.txt)
          elif [ -s bark-summary-detect.txt ]; then
            summary=$(<bark-summary-detect.txt)
          fi
          if [ -z "${summary}" ]; then
            summary="摘要未生成"
          fi

          body="${WORKFLOW} | ${BRANCH} | ${short_sha}"$'\n'"${summary}"
          level="active"
          if [ "${RESULT}" = "success" ]; then
            level="passive"
          fi

          payload=$(jq -n \
            --arg title "${title}" \
            --arg body "${body}" \
            --arg group "GitHub CI" \
            --arg level "${level}" \
            '{
              title: $title,
              body: $body,
              group: $group,
              level: $level
            }')

          curl --fail --silent --show-error \
            --request POST "${BARK_WEBHOOK_URL}" \
            --header "Content-Type: application/json" \
            --data "${payload}"
