---
# Install host packages. Requires messup_apk_packages and messup_apt_packages lists.
- name: Install packages (Alpine)
  apk:
    name: "{{ messup_apk_packages }}"
    state: present
    update_cache: true
  when: _is_alpine | bool

- name: Install packages (Debian)
  apt:
    name: "{{ messup_apt_packages }}"
    state: present
    update_cache: true
  when: _is_debian | bool
