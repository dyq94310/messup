---
# Service-only entry point for scoped automatic deployments.
# Caller (ansible-deploy.yml) runs SSH bootstrap, connectivity, then
# 00-bootstrap-python once for planned hosts before importing these plays.
- name: Import SmartDNS deploy
  import_playbook: 02-deploy-smartdns.yml
  tags: [smartdns, dns]

- name: Import Sing-box deploy
  import_playbook: 01-deploy-singbox.yml
  tags: [singbox, proxy]

- name: Import nft port-forward deploy
  import_playbook: 03-deploy-nft.yml
  tags: [nft, nat]

- name: Import probe deploy
  import_playbook: 04-deploy-probe.yml
  tags: [probe]
