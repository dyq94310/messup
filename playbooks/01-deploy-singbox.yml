---
# 部署 / 更新 Sing-box（二进制 + OpenRC/systemd + 按节点私有配置）
# 支持 Alpine (OpenRC/musl) 与 Debian/Ubuntu (systemd/glibc)
- name: Deactivate Sing-box on nodes outside singbox_nodes
  hosts: all_nodes:!singbox_nodes
  become: false
  gather_facts: true
  ignore_unreachable: true
  any_errors_fatal: false
  tags: [singbox, proxy, deactivate]

  pre_tasks:
    - name: Load sing-box defaults for deactivation
      include_vars:
        file: "{{ private_config_temp }}/singbox/vars.yml"
        name: _singbox_defaults
      delegate_to: localhost
      become: false

    - name: Apply sing-box service default for deactivation
      set_fact:
        singbox_service: "{{ _singbox_defaults.singbox_service }}"

  tasks:
    - name: Detect OS / init
      ansible.builtin.include_tasks: tasks/detect_os.yml

    - name: Warn when Sing-box deactivation cannot detect init
      debug:
        msg: "⚠️ {{ inventory_hostname }} 无法识别 init，跳过 Sing-box 停用。"
      when: _init == 'unknown'

    - name: Deactivate Sing-box service
      ansible.builtin.include_tasks: tasks/deactivate_service_unit.yml
      vars:
        messup_service_name: "{{ singbox_service }}"
      when: _init in ['openrc', 'systemd']

- name: Deploy sing-box on singbox nodes
  hosts: singbox_nodes
  become: false
  gather_facts: true
  ignore_unreachable: true
  any_errors_fatal: false
  tags: [singbox, proxy]

  pre_tasks:
    - name: Resolve sing-box defaults path
      set_fact:
        _singbox_defaults_src: "{{ private_config_temp }}/singbox/vars.yml"

    - name: Check sing-box defaults exist on control node
      stat:
        path: "{{ _singbox_defaults_src }}"
      delegate_to: localhost
      become: false
      register: _singbox_defaults_stat

    - name: Fail if sing-box defaults are missing
      assert:
        that:
          - _singbox_defaults_stat.stat.exists
          - _singbox_defaults_stat.stat.isreg
        fail_msg: "❌ 找不到 sing-box 默认变量: {{ _singbox_defaults_src }}"

    - name: Load sing-box defaults
      include_vars:
        file: "{{ _singbox_defaults_src }}"
        name: _singbox_defaults
      delegate_to: localhost
      become: false

    - name: Apply sing-box defaults
      set_fact:
        "{{ item }}": "{{ _singbox_defaults[item] }}"
      loop:
        - singbox_port_profile
        - singbox_config_source
        - singbox_version
        - singbox_install_dir
        - singbox_bin
        - singbox_config
        - singbox_service
        - singbox_cert_dir
        - _singbox_cert_cache_dir
        - _singbox_cert_local_archive
        - _singbox_cert_remote_archive
        - singbox_ntp_server
        - singbox_ntp_port
      when: vars[item] is not defined

    - name: Resolve private config paths
      set_fact:
        _singbox_config_dir: "{{ private_config_temp }}/singbox"
        _singbox_cfg_src: "{{ private_config_temp }}/singbox/config.json.j2"
        _singbox_full_config_src: "{{ private_config_temp }}/singbox/full/{{ inventory_hostname }}.json"
        _singbox_wireguard_src: "{{ private_config_temp }}/singbox/wireguard/config.json"
        _singbox_wireguard_device_peers_src: "{{ private_config_temp }}/singbox/wireguard/device-peers.json"
        _singbox_wireguard_template_src: "{{ private_config_temp }}/singbox/wireguard/output.json.j2"
        _singbox_port_profiles_src: "{{ private_config_temp }}/singbox/port_profiles.yml"

    - name: Resolve sing-box configuration source
      set_fact:
        _singbox_config_source: "{{ singbox_config_source | default('template') }}"

    - name: Validate sing-box configuration source
      assert:
        that:
          - _singbox_config_source in ['template', 'full']
        fail_msg: >-
          ❌ singbox_config_source={{ _singbox_config_source }} 无效，
          只支持 template 或 full。

    - name: Load sing-box port profiles
      include_vars:
        file: "{{ _singbox_port_profiles_src }}"
        name: _singbox_port_profile_vars
      delegate_to: localhost
      become: false
      when: _singbox_config_source == 'template'

    - name: Resolve sing-box port profile name
      set_fact:
        _singbox_selected_profile: "{{ singbox_port_profile | default('default') }}"
      when: _singbox_config_source == 'template'

    - name: Require sing-box port profile
      assert:
        that:
          - _singbox_selected_profile == 'default' or _singbox_selected_profile in _singbox_port_profile_vars.singbox_port_profiles
          - _singbox_port_profile_vars.singbox_port_defaults is mapping
        fail_msg: >-
          ❌ 找不到 sing-box 端口 profile={{ _singbox_selected_profile }}。
          可用 profile: {{ (['default'] + (_singbox_port_profile_vars.singbox_port_profiles.keys() | list)) | unique }}
      when: _singbox_config_source == 'template'

    - name: Resolve sing-box ports
      set_fact:
        singbox_ports: >-
          {{ _singbox_port_profile_vars.singbox_port_defaults
             | combine(
                 _singbox_port_profile_vars.singbox_port_profiles.get(
                   _singbox_selected_profile, {}
                 )
               ) }}
      when: _singbox_config_source == 'template'

    - name: Validate sing-box ports
      assert:
        that:
          - singbox_ports is mapping
          - singbox_ports | length > 0
          - (singbox_ports.values() | list | select('integer') | list | length) == (singbox_ports.values() | list | length)
          - >-
            (singbox_ports.values() | list
            | select('integer')
            | select('ge', 1)
            | select('le', 65535)
            | list | length) == (singbox_ports.values() | list | length)
        fail_msg: >-
          ❌ sing-box port profile={{ _singbox_selected_profile }} 无效：
          必须是非空对象，所有端口必须为 1-65535 的整数。
        success_msg: "sing-box ports validation passed"
      when: _singbox_config_source == 'template'

    - name: Load sing-box inbound files
      set_fact:
        _singbox_inbound_files: >-
          {{ lookup(
               'ansible.builtin.fileglob',
               _singbox_config_dir ~ '/inbounds/*.json',
               wantlist=True
             ) | sort }}
      when: _singbox_config_source == 'template'

    - name: Require sing-box inbound files
      assert:
        that:
          - _singbox_inbound_files is sequence
          - _singbox_inbound_files is not string
          - _singbox_inbound_files | length > 0
        fail_msg: "❌ 找不到 sing-box inbound 配置文件: {{ _singbox_config_dir }}/inbounds/*.json"
      when: _singbox_config_source == 'template'

    - name: Validate sing-box inbound filenames
      assert:
        that:
          - (item | basename | replace('.json', '')) in singbox_ports
        fail_msg: >-
          ❌ inbound 文件名必须对应现有 port_key：{{ item | basename }}。
      loop: "{{ _singbox_inbound_files }}"
      loop_control:
        label: "{{ item | basename }}"
      when: _singbox_config_source == 'template'

    - name: Check sing-box inbound files exist on control node
      stat:
        path: "{{ item }}"
      delegate_to: localhost
      become: false
      register: _singbox_inbound_file_stats
      loop: "{{ _singbox_inbound_files }}"
      loop_control:
        label: "{{ item | basename }}"
      when: _singbox_config_source == 'template'

    - name: Require sing-box inbound files
      assert:
        that:
          - item.stat.exists
          - item.stat.isreg
        fail_msg: "❌ 找不到 sing-box inbound 配置: {{ item.item | basename }}"
      loop: "{{ _singbox_inbound_file_stats.results }}"
      loop_control:
        label: "{{ item.item | basename }}"
      when: _singbox_config_source == 'template'

    - name: Assemble sing-box inbounds for selected port profile
      set_fact:
        _singbox_inbounds: >-
          {{
            (_singbox_inbounds | default([])) + [
              (
                lookup('ansible.builtin.file', item)
                | from_json
                 | combine({'listen_port': singbox_ports[(item | basename | replace('.json', ''))]})
              )
            ]
          }}
      loop: "{{ _singbox_inbound_files }}"
      loop_control:
        label: "{{ item | basename }}"
      no_log: true
      when: _singbox_config_source == 'template'

    - name: Ensure private config exists on control node
      stat:
        path: "{{ _singbox_cfg_src }}"
      delegate_to: localhost
      become: false
      register: _cfg_stat
      when: _singbox_config_source == 'template'

    - name: Fail if private config missing
      assert:
        that:
          - _cfg_stat.stat.exists
          - _cfg_stat.stat.isreg
        fail_msg: >-
          ❌ 找不到节点配置: {{ _singbox_cfg_src }}
          请确认:
            1) messup-private 已 checkout / 软链到 private-config
            2) 存在 singbox/config.json.j2
            3) CI 是否设置 -e private_config_temp=...
      when: _singbox_config_source == 'template'

    - name: Check full sing-box config exists on control node
      stat:
        path: "{{ _singbox_full_config_src }}"
      delegate_to: localhost
      become: false
      register: _singbox_full_config_stat
      when: _singbox_config_source == 'full'

    - name: Require full sing-box config
      assert:
        that:
          - _singbox_full_config_stat.stat.exists
          - _singbox_full_config_stat.stat.isreg
        fail_msg: "❌ 找不到完整 sing-box 配置: {{ _singbox_full_config_src }}"
      when: _singbox_config_source == 'full'

    - name: Check sing-box WireGuard configuration files
      stat:
        path: "{{ item }}"
      delegate_to: localhost
      become: false
      register: _singbox_wireguard_stats
      loop:
        - "{{ _singbox_wireguard_src }}"
        - "{{ _singbox_wireguard_device_peers_src }}"
      when: _singbox_config_source == 'template'

    - name: Require sing-box WireGuard configuration files
      assert:
        that:
          - item.stat.exists
          - item.stat.isreg
        fail_msg: >-
          ❌ 找不到 WireGuard 配置: {{ item.item }}
      loop: "{{ _singbox_wireguard_stats.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: _singbox_config_source == 'template'

    - name: Load sing-box WireGuard endpoint variables
      include_vars:
        file: "{{ _singbox_wireguard_src }}"
        name: _singbox_wireguard_vars
      when: _singbox_config_source == 'template'

    - name: Load sing-box WireGuard device peer variables
      include_vars:
        file: "{{ _singbox_wireguard_device_peers_src }}"
        name: _singbox_wireguard_device_peer_vars
      when: _singbox_config_source == 'template'

    - name: Validate sing-box WireGuard variables
      assert:
        that:
          - _singbox_wireguard_vars.singbox_wireguard is mapping
          - _singbox_wireguard_vars.singbox_wireguard.endpoints is mapping
          - _singbox_wireguard_device_peer_vars.device_peers is mapping
        fail_msg: >-
          ❌ WireGuard 配置格式无效。
      when: _singbox_config_source == 'template'

    - name: Resolve current sing-box WireGuard endpoint
      set_fact:
        _singbox_wireguard: "{{ _singbox_wireguard_vars.singbox_wireguard }}"
        _singbox_wireguard_endpoint: "{{ _singbox_wireguard_vars.singbox_wireguard.endpoints.get(inventory_hostname, {}) }}"
        _singbox_wireguard_enabled: >-
          {{
            _singbox_wireguard_vars.singbox_wireguard.endpoints
            .get(inventory_hostname, {})
             .get('enabled', false) | bool
           }}
      when: _singbox_config_source == 'template'

    - name: Assemble enabled upstream WireGuard peers
      set_fact:
        _singbox_wireguard_peers: >-
          {{
            (_singbox_wireguard_peers | default([])) + [
              item | dict2items | rejectattr('key', 'equalto', 'enabled') | items2dict
            ]
          }}
      loop: >-
        {{
          _singbox_wireguard_endpoint.get('upstream_peers', {}).values()
          | selectattr('enabled', 'equalto', true) | list
        }}
      no_log: true
      when: _singbox_config_source == 'template'

    - name: Assemble enabled device WireGuard peers
      set_fact:
        _singbox_wireguard_peers: >-
          {{
            (_singbox_wireguard_peers | default([])) + [
              item | dict2items
              | rejectattr('key', 'in', ['enabled', 'private_key']) | items2dict
            ]
          }}
      loop: >-
        {{
          _singbox_wireguard_device_peer_vars.device_peers.values()
          | selectattr('enabled', 'equalto', true) | list
        }}
      no_log: true
      when: _singbox_config_source == 'template'

    - name: Render sing-box WireGuard fragment
      set_fact:
        _singbox_wireguard_fragment: >-
          {{ lookup('ansible.builtin.template', _singbox_wireguard_template_src) | from_json }}
      no_log: true
      when:
        - _singbox_config_source == 'template'
        - _singbox_wireguard_enabled

    - name: Assemble sing-box route rules
      set_fact:
        _singbox_wireguard_endpoints: >-
          {{ _singbox_wireguard_fragment.endpoints | default([]) }}
        _singbox_route_rules: >-
          {{
            (_singbox_wireguard_fragment.route_rules | default([])) + [
              {'action': 'sniff'},
              {'protocol': 'dns', 'action': 'hijack-dns'}
            ]
          }}
      when: _singbox_config_source == 'template'

  tasks:
    - name: Detect OS / init
      ansible.builtin.include_tasks: tasks/detect_os.yml

    - name: Fail on unsupported OS
      fail:
        msg: >-
          ❌ {{ inventory_hostname }} 不支持的系统（需要 Alpine 或 Debian/Ubuntu）。
           os_family={{ ansible_facts['os_family'] | default('?') }} pkg_mgr={{ ansible_facts['pkg_mgr'] | default('?') }}
      when: _init == 'unknown'

    - name: Ensure Debian python for apt module
      ansible.builtin.include_tasks: tasks/ensure_debian_python.yml

    - name: Install runtime dependencies
      ansible.builtin.include_tasks: tasks/install_host_packages.yml
      vars:
        messup_apk_packages:
          - curl
          - tar
          - ca-certificates
          - openrc
        messup_apt_packages:
          - curl
          - tar
          - ca-certificates

    - name: Detect CPU architecture (sing-box release naming)
      set_fact:
        target_arch: >-
          {{
            'amd64' if ansible_facts['architecture'] in ['x86_64', 'amd64'] else
            'arm64' if ansible_facts['architecture'] in ['aarch64', 'arm64'] else
            'armv7' if ansible_facts['architecture'] in ['armv7l', 'armv7'] else
            'unknown'
          }}
        # Alpine = musl；Debian/Ubuntu = glibc
        singbox_libc: "{{ 'musl' if (_is_alpine | bool) else 'glibc' }}"

    - name: Fail on unknown architecture
      fail:
        msg: >-
          ❌ 不支持的架构: {{ ansible_facts['architecture'] }}
          支持: x86_64/amd64 → amd64, aarch64/arm64 → arm64, armv7l → armv7
      when: target_arch == 'unknown'

    - name: Show target architecture
      debug:
        msg: >-
          Host {{ inventory_hostname }} os={{ ansible_facts['os_family'] | default('?') }}
          init={{ _init }} arch={{ ansible_facts['architecture'] }}
          libc={{ singbox_libc }} → {{ target_arch }}

    - name: Ensure install directory
      file:
        path: "{{ singbox_install_dir }}"
        state: directory
        mode: "0755"
        owner: root
        group: root

    - name: Check currently installed sing-box version
      command: "{{ singbox_bin }} version"
      register: _installed_ver
      changed_when: false
      failed_when: false

    - name: Decide whether binary reinstall is needed
      set_fact:
        _need_bin_install: >-
          {{
            (_installed_ver.rc | default(1) != 0) or
            (singbox_version not in (_installed_ver.stdout | default('')))
          }}

    - name: Download sing-box release
      get_url:
        url: >-
          https://github.com/SagerNet/sing-box/releases/download/v{{ singbox_version }}/sing-box-{{ singbox_version }}-linux-{{ target_arch }}-{{ singbox_libc }}.tar.gz
        dest: "/tmp/sing-box-{{ singbox_version }}-{{ target_arch }}-{{ singbox_libc }}.tar.gz"
        mode: "0644"
        force: true
        timeout: 120
      register: _dl
      retries: 3
      delay: 5
      until: _dl is succeeded
      when: _need_bin_install | bool

    - name: Extract sing-box binary
      unarchive:
        src: "/tmp/sing-box-{{ singbox_version }}-{{ target_arch }}-{{ singbox_libc }}.tar.gz"
        dest: "{{ singbox_install_dir }}"
        remote_src: true
        extra_opts: ["--strip-components=1"]
      when: _need_bin_install | bool
      notify: Restart singbox

    - name: Ensure binary executable
      file:
        path: "{{ singbox_bin }}"
        mode: "0755"
        owner: root
        group: root
      register: _bin_mode

    - name: Fail if binary still missing
      stat:
        path: "{{ singbox_bin }}"
      register: _bin_stat

    - name: Assert sing-box binary present
      assert:
        that:
          - _bin_stat.stat.exists
          - _bin_stat.stat.executable
        fail_msg: "❌ sing-box 二进制不存在或不可执行: {{ singbox_bin }}"

    - name: Render node-specific config from private repo
      template:
        src: "{{ _singbox_cfg_src }}"
        dest: "{{ singbox_config }}"
        mode: "0600"
        owner: root
        group: root
      notify: Restart singbox
      diff: false
      when: _singbox_config_source == 'template'

    - name: Copy full node-specific config from private repo
      copy:
        src: "{{ _singbox_full_config_src }}"
        dest: "{{ singbox_config }}"
        mode: "0600"
        owner: root
        group: root
      notify: Restart singbox
      diff: false
      when: _singbox_config_source == 'full'

    - name: Collect configured sing-box certificate source hosts
      set_fact:
        _singbox_cert_source_hosts: "{{ (_singbox_cert_source_hosts | default([])) + [item] }}"
      loop: "{{ groups['singbox_nodes'] | default([]) }}"
      when: hostvars[item].singbox_cert_source | default(false) | bool

    - name: Require exactly one sing-box certificate source host
      assert:
        that:
          - (_singbox_cert_source_hosts | default([]) | length) == 1
        fail_msg: >-
          ❌ 必须在 inventory 的 singbox_nodes 中用 singbox_cert_source=true 标记且只标记一台证书源节点。
          当前匹配: {{ _singbox_cert_source_hosts | default([]) }}

    - name: Resolve sing-box certificate source host
      set_fact:
        _singbox_cert_source_host: "{{ _singbox_cert_source_hosts[0] }}"

    - name: Check local sing-box certificate directory
      shell: |
        set -eu
        if [ ! -d "{{ singbox_cert_dir }}" ]; then
          exit 1
        fi
        cert_count=$(find "{{ singbox_cert_dir }}" -type f \( -name '*.crt' -o -name '*.cer' -o -name '*.pem' \) -exec test -s {} \; -print 2>/dev/null | wc -l)
        key_count=$(find "{{ singbox_cert_dir }}" -type f \( -name '*.key' -o -name '*key*.pem' \) -exec test -s {} \; -print 2>/dev/null | wc -l)
        test "$cert_count" -gt 0
        test "$key_count" -gt 0
      args:
        executable: /bin/sh
      register: _local_cert_dir_check
      changed_when: false
      failed_when: false

    - name: Check source sing-box certificate directory before sync
      shell: |
        set -eu
        if [ ! -d "{{ singbox_cert_dir }}" ]; then
          exit 1
        fi
        cert_count=$(find "{{ singbox_cert_dir }}" -type f \( -name '*.crt' -o -name '*.cer' -o -name '*.pem' \) -exec test -s {} \; -print 2>/dev/null | wc -l)
        key_count=$(find "{{ singbox_cert_dir }}" -type f \( -name '*.key' -o -name '*key*.pem' \) -exec test -s {} \; -print 2>/dev/null | wc -l)
        test "$cert_count" -gt 0
        test "$key_count" -gt 0
      args:
        executable: /bin/sh
      register: _source_cert_dir_check
      changed_when: false
      failed_when: false
      delegate_to: "{{ _singbox_cert_source_host }}"
      when: _local_cert_dir_check.rc != 0

    - name: Fail if local certificate directory is missing and source has no certificates
      fail:
        msg: >-
          ❌ {{ inventory_hostname }} 缺少 sing-box 证书目录 {{ singbox_cert_dir }}，
          且源节点 {{ _singbox_cert_source_host }} 的同名目录不存在，或没有同时包含证书文件与私钥文件。
          已中止，避免 sing-box 启动时反复触发 ACME。
      when:
        - _local_cert_dir_check.rc != 0
        - _source_cert_dir_check.rc != 0

    - name: Prepare local certificate cache directory
      file:
        path: "{{ _singbox_cert_cache_dir }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
      when: _local_cert_dir_check.rc != 0

    - name: Create certificate archive on source host
      shell: |
        set -eu
        rm -f "{{ _singbox_cert_remote_archive }}"
        tar -C "{{ singbox_cert_dir }}" -czf "{{ _singbox_cert_remote_archive }}" .
      args:
        executable: /bin/sh
      changed_when: true
      delegate_to: "{{ _singbox_cert_source_host }}"
      when: _local_cert_dir_check.rc != 0

    - name: Fetch certificate archive to control node
      fetch:
        src: "{{ _singbox_cert_remote_archive }}"
        dest: "{{ _singbox_cert_local_archive }}"
        flat: true
      delegate_to: "{{ _singbox_cert_source_host }}"
      when: _local_cert_dir_check.rc != 0

    - name: Clear invalid local certificate directory before mirror restore
      file:
        path: "{{ singbox_cert_dir }}"
        state: absent
      when: _local_cert_dir_check.rc != 0

    - name: Recreate local certificate directory before mirror restore
      file:
        path: "{{ singbox_cert_dir }}"
        state: directory
        mode: "0700"
        owner: root
        group: root
      when: _local_cert_dir_check.rc != 0

    - name: Mirror certificate directory from source archive
      unarchive:
        src: "{{ _singbox_cert_local_archive }}"
        dest: "{{ singbox_cert_dir }}"
        remote_src: false
        owner: root
        group: root
      when: _local_cert_dir_check.rc != 0
      notify: Restart singbox

    - name: Verify mirrored certificate directory
      shell: |
        set -eu
        cert_count=$(find "{{ singbox_cert_dir }}" -type f \( -name '*.crt' -o -name '*.cer' -o -name '*.pem' \) -exec test -s {} \; -print 2>/dev/null | wc -l)
        key_count=$(find "{{ singbox_cert_dir }}" -type f \( -name '*.key' -o -name '*key*.pem' \) -exec test -s {} \; -print 2>/dev/null | wc -l)
        test "$cert_count" -gt 0
        test "$key_count" -gt 0
      args:
        executable: /bin/sh
      register: _mirrored_cert_dir_check
      changed_when: false
      when: _local_cert_dir_check.rc != 0

    - name: Remove source certificate archive
      file:
        path: "{{ _singbox_cert_remote_archive }}"
        state: absent
      delegate_to: "{{ _singbox_cert_source_host }}"
      changed_when: false
      when: _local_cert_dir_check.rc != 0

    - name: Remove local certificate archive cache
      file:
        path: "{{ _singbox_cert_cache_dir }}"
        state: absent
      delegate_to: localhost
      become: false
      changed_when: false
      when: _local_cert_dir_check.rc != 0

    - name: Validate config with sing-box check
      command: "{{ singbox_bin }} check -c {{ singbox_config }}"
      register: _check
      changed_when: false
      failed_when: false

    - name: Fail if config check failed
      fail:
        msg: >-
          ❌ sing-box 配置校验失败 ({{ singbox_config }})
          源文件: {{ _singbox_cfg_src }}
          输出:
          {{ _check.stdout | default('') }}
          {{ _check.stderr | default('') }}
      when: _check.rc != 0

    - name: Deploy service unit and ensure running
      ansible.builtin.include_tasks: tasks/deploy_service_unit.yml
      vars:
        messup_service_name: "{{ singbox_service }}"
        messup_openrc_src: "{{ playbook_dir }}/../templates/singbox.openrc.j2"
        messup_systemd_src: "{{ playbook_dir }}/../templates/singbox.service.j2"
        messup_service_notify: Restart singbox

    - name: Configure sing-box and Realm log rotation
      ansible.builtin.include_tasks: tasks/configure_service_logrotate.yml

    - name: Cleanup download archive
      file:
        path: "/tmp/sing-box-{{ singbox_version }}-{{ target_arch }}-{{ singbox_libc }}.tar.gz"
        state: absent
      when: _need_bin_install | bool

    - name: Read installed version
      command: "{{ singbox_bin }} version"
      register: version_out
      changed_when: false
      failed_when: false

    - name: Check service status
      ansible.builtin.include_tasks: tasks/check_service_status.yml
      vars:
        messup_service_name: "{{ singbox_service }}"

    - name: Deployment summary
      debug:
        msg:
          - "✅ sing-box deployed"
          - "  host:     {{ inventory_hostname }}"
          - "  os/init:  {{ ansible_facts['os_family'] | default('?') }} / {{ _init }}"
          - "  version:  {{ singbox_version }}"
          - "  arch:     {{ target_arch }} ({{ singbox_libc }})"
          - "  binary:   {{ singbox_bin }}"
          - "  config:   {{ singbox_config }}"
          - "  detail:   {{ version_out.stdout_lines | default(['n/a']) | first }}"
          - "  service:  {{ _svc_status.stdout | default('n/a') | trim }}"

  handlers:
    - name: Restart singbox (OpenRC)
      listen: Restart singbox
      command: "rc-service {{ singbox_service }} restart"
      when: _init == 'openrc'

    - name: Restart singbox (systemd)
      listen: Restart singbox
      service:
        name: "{{ singbox_service }}"
        state: restarted
      when: _init == 'systemd'
