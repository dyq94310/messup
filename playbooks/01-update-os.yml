---
- name: Update OS packages (Alpine/Debian)
  hosts: all_nodes
  become: true
  gather_facts: false
  vars:
    ansible_connection: ssh
    ansible_become: true
  tasks:
    - name: Detect OS and update packages
      block:
        - name: Check OS family
          ansible.builtin.command: cat /etc/os-release
          register: os_release
          changed_when: false
          failed_when: false

        - name: Alpine update
          ansible.builtin.command: |
            apk update && apk upgrade --no-cache
          when: "'alpine' in (os_release.stdout | lower)"
          register: result_alpine
          changed_when: result_alpine.rc == 0
          failed_when: false

        - name: Debian update
          ansible.builtin.command: |
            apt update && apt upgrade -y --no-install-recommends --no-install-suggests
          when: "'debian' in (os_release.stdout | lower) or 'ubuntu' in (os_release.stdout | lower)"
          register: result_debian
          changed_when: result_debian.rc == 0
          failed_when: false

        - name: Show update result
          ansible.builtin.debug:
            msg: "Alpine update result: {{ result_alpine.stdout }} / {{ result_alpine.stderr }}"
          when: result_alpine is defined and result_alpine.stdout

        - name: Show update result
          ansible.builtin.debug:
            msg: "Debian update result: {{ result_debian.stdout }} / {{ result_debian.stderr }}"
          when: result_debian is defined and result_debian.stdout
