---
# 按主机名从 private nft/forwards.yml 取 DNAT，生成 rules.nft 后用 nft -f 下发。
# OpenRC/systemd oneshot 开机再加载同一份规则。禁止 tc。
# Soft-fail（本机跳过 nft，不拖死其它主机）：不支持 OS、装包失败、
#   nft preflight 无 CAP_NET_ADMIN、无默认网卡且未设 nft_in_if。
# Hard-fail（该 host 任务失败，PLAYBOOK_RC 非 0）：缺 forwards.yml、主机名未对齐、preflight 后下发/apply/校验失败。
- name: Deploy nft port-forward on nft nodes
  hosts: nft_nodes
  become: false
  gather_facts: true
  ignore_unreachable: true
  any_errors_fatal: false
  tags: [nft, nat]

  pre_tasks:
    - name: Resolve nft forwards path
      set_fact:
        _nft_src: "{{ private_config_temp }}/nft/forwards.yml"

    - name: Check nft forwards exist on control node
      stat:
        path: "{{ _nft_src }}"
      delegate_to: localhost
      become: false
      register: _nft_src_stat

    - name: Fail if nft forwards are missing
      assert:
        that:
          - _nft_src_stat.stat.exists
          - _nft_src_stat.stat.isreg
        fail_msg: "❌ 找不到 nft 转发配置: {{ _nft_src }}"

    - name: Load nft forwards
      include_vars:
        file: "{{ _nft_src }}"
        name: _nft_file
      delegate_to: localhost
      become: false

    - name: Apply nft defaults
      set_fact:
        "{{ item }}": "{{ _nft_file[item] }}"
      loop:
        - nft_install_dir
        - nft_service
        - nft_mark
      when: vars[item] is not defined

    - name: Require hostname-aligned nft forwards
      assert:
        that:
          - _nft_file.nft_forwards is mapping
          - inventory_hostname in _nft_file.nft_forwards
          - _nft_file.nft_forwards[inventory_hostname] is mapping
        fail_msg: >-
          ❌ Host {{ inventory_hostname }} 必须出现在 nft/forwards.yml 的 nft_forwards 中。
        success_msg: "nft_forwards host={{ inventory_hostname }}"

    - name: Store host nft forwards
      set_fact:
        nft_forwards: "{{ _nft_file.nft_forwards }}"
        _nft_host_forwards: "{{ _nft_file.nft_forwards[inventory_hostname] }}"
        _nft_ok: true
        _nft_skip_reason: ""

  tasks:
    - name: Detect OS / init
      ansible.builtin.include_tasks: tasks/detect_os.yml
      when: _nft_ok | bool

    - name: Warn if unsupported OS (skip nft, do not fail host)
      debug:
        msg: >-
          ⚠️  {{ inventory_hostname }} 不支持的系统（需要 Alpine 或 Debian/Ubuntu），跳过 nft。
           os_family={{ ansible_facts['os_family'] | default('?') }} pkg_mgr={{ ansible_facts['pkg_mgr'] | default('?') }}
      when: _nft_ok | bool and _init == 'unknown'

    - name: Mark skip when unsupported OS
      set_fact:
        _nft_ok: false
        _nft_skip_reason: "unsupported OS (need Alpine or Debian/Ubuntu)"
      when: _nft_ok | bool and _init == 'unknown'

    # Soft-fail package path stays inline (ignore_errors); shared install_host_packages is hard-fail.
    - name: Install nftables, iptables, iproute2 (Alpine)
      apk:
        name:
          - nftables
          - iptables
          - iproute2
        state: present
        update_cache: true
      when: _nft_ok | bool and (_is_alpine | bool)
      register: _nft_pkg
      ignore_errors: true

    - name: Ensure Debian python for apt module
      ansible.builtin.include_tasks: tasks/ensure_debian_python.yml
      when: _nft_ok | bool

    - name: Install nftables, iptables, iproute2 (Debian)
      apt:
        name:
          - nftables
          - iptables
          - iproute2
        state: present
        update_cache: true
      when: _nft_ok | bool and (_is_debian | bool)
      register: _nft_pkg
      ignore_errors: true

    - name: Warn if package install failed
      debug:
        msg: "⚠️  安装 nftables/iptables/iproute2 失败，跳过本机 nft：{{ _nft_pkg.msg | default('unknown') }}"
      when: _nft_ok | bool and _nft_pkg is failed

    - name: Mark skip when package install failed
      set_fact:
        _nft_ok: false
        _nft_skip_reason: "package install failed"
      when: _nft_ok | bool and _nft_pkg is failed

    - name: Preflight nft netlink (needs CAP_NET_ADMIN)
      command: nft list tables
      register: _nft_preflight
      changed_when: false
      failed_when: false
      when: _nft_ok | bool

    - name: Warn if nft has no permission (skip apply, do not fail)
      debug:
        msg: >-
          ⚠️  nft 无法操作 netlink，跳过本机 apply：
          {{ _nft_preflight.stderr | default(_nft_preflight.msg) | default('') | trim }}
           容器/LXC 通常需 CAP_NET_ADMIN（及 CAP_NET_RAW）；KVM 请检查系统防火墙与安全策略。
          Proxmox：勿 drop net_admin，重启 CT 后再跑 --tags nft。
      when: _nft_ok | bool and (_nft_preflight.rc | default(1)) != 0

    - name: Mark skip when nft preflight failed
      set_fact:
        _nft_ok: false
        _nft_skip_reason: "nft netlink permission denied (need CAP_NET_ADMIN)"
      when: _nft_ok | bool and (_nft_preflight.rc | default(1)) != 0

    - name: Detect default route interface
      shell: |
        set -e
        ip -4 route show default 2>/dev/null \
          | awk '{for (i=1;i<=NF;i++) if ($i=="dev") {print $(i+1); exit}}'
      args:
        executable: /bin/sh
      register: _nft_def_if
      changed_when: false
      failed_when: false
      when: _nft_ok | bool

    - name: Warn if default interface unknown and not overridden
      debug:
        msg: "⚠️  无法探测默认路由网卡且未设置 nft_in_if，跳过本机 nft。"
      when: >-
        _nft_ok | bool
        and (nft_in_if | default('') | length == 0)
        and (_nft_def_if.stdout | default('') | trim | length == 0)

    - name: Mark skip when interface unknown
      set_fact:
        _nft_ok: false
        _nft_skip_reason: "no default route iface and nft_in_if unset"
      when: >-
        _nft_ok | bool
        and (nft_in_if | default('') | length == 0)
        and (_nft_def_if.stdout | default('') | trim | length == 0)

    - name: Resolve nft interfaces
      set_fact:
        _nft_in_if: "{{ (nft_in_if | default('') | length > 0) | ternary(nft_in_if, _nft_def_if.stdout | trim) }}"
        _nft_out_if: "{{ (nft_out_if | default('') | length > 0) | ternary(nft_out_if, ((nft_in_if | default('') | length > 0) | ternary(nft_in_if, _nft_def_if.stdout | trim))) }}"
      when: _nft_ok | bool

    - name: Show nft deploy target
      debug:
        msg: >-
          host={{ inventory_hostname }}
          init={{ _init }} in={{ _nft_in_if }} out={{ _nft_out_if }}
          forwards={{ _nft_host_forwards | length }}
          rules={{ nft_install_dir }}/rules.nft
      when: _nft_ok | bool

    # --- Hard path: capability preflight passed; failures fail this host ---
    - name: Read ip_forward
      command: sysctl -n net.ipv4.ip_forward
      register: _nft_fwd
      changed_when: false
      failed_when: false
      when: _nft_ok | bool

    - name: Enable ip_forward
      command: sysctl -w net.ipv4.ip_forward=1
      register: _nft_fwd_set
      failed_when: false
      when: _nft_ok | bool and (_nft_fwd.stdout | default('0') | trim) != "1"

    - name: Fail if ip_forward cannot be enabled
      fail:
        msg: "cannot set net.ipv4.ip_forward=1 (current={{ _nft_fwd.stdout | default('?') | trim }})"
      when: >-
        _nft_ok | bool
        and (_nft_fwd.stdout | default('0') | trim) != "1"
        and (_nft_fwd_set.rc | default(1)) != 0

    - name: Ensure install directory
      file:
        path: "{{ nft_install_dir }}"
        state: directory
        mode: "0755"
        owner: root
        group: root
      when: _nft_ok | bool

    - name: Remove leftover apply.sh artifacts
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ nft_install_dir }}/apply.sh"
        - "{{ nft_install_dir }}/mappings.txt"
        - "{{ nft_install_dir }}/env"
      when: _nft_ok | bool

    - name: Deploy nft rules
      template:
        src: "{{ playbook_dir }}/../templates/messup-nft.nft.j2"
        dest: "{{ nft_install_dir }}/rules.nft"
        mode: "0644"
        owner: root
        group: root
      when: _nft_ok | bool

    - name: Remove leftover traffic control qdisc
      command: tc qdisc del dev {{ item }} root
      loop: "{{ [_nft_in_if, _nft_out_if] | unique }}"
      register: _nft_tc_del
      failed_when: false
      changed_when: _nft_tc_del.rc | default(1) == 0
      when: _nft_ok | bool

    - name: Allow marked forwarded connections
      shell: |
        iptables -C FORWARD -m connmark --mark "{{ nft_mark }}" -j ACCEPT 2>/dev/null \
          || iptables -I FORWARD 1 -m connmark --mark "{{ nft_mark }}" -j ACCEPT
      args:
        executable: /bin/sh
      register: _nft_ipt
      changed_when: "'ACCEPT' in (_nft_ipt.stderr | default('')) or (_nft_ipt.rc | default(1)) == 0"
      when: _nft_ok | bool

    - name: Deploy OpenRC service unit
      template:
        src: "{{ playbook_dir }}/../templates/messup-nft.openrc.j2"
        dest: "/etc/init.d/{{ nft_service }}"
        mode: "0755"
        owner: root
        group: root
      register: _nft_unit
      when: _nft_ok | bool and _init == 'openrc'

    - name: Deploy systemd service unit
      template:
        src: "{{ playbook_dir }}/../templates/messup-nft.service.j2"
        dest: "/etc/systemd/system/{{ nft_service }}.service"
        mode: "0644"
        owner: root
        group: root
      register: _nft_unit
      when: _nft_ok | bool and _init == 'systemd'

    - name: Reload systemd after unit change
      systemd:
        daemon_reload: true
      when: >-
        _nft_ok | bool
        and _init == 'systemd'
        and (_nft_unit is defined and _nft_unit is changed)

    - name: Enable messup-nft (OpenRC default runlevel)
      command: "rc-update add {{ nft_service }} default"
      register: _nft_enable
      changed_when: "'already installed' not in (_nft_enable.stdout | default(''))"
      when: _nft_ok | bool and _init == 'openrc'

    - name: Enable messup-nft (systemd)
      service:
        name: "{{ nft_service }}"
        enabled: true
      when: _nft_ok | bool and _init == 'systemd'

    - name: Apply via service (OpenRC restart = nft -f rules.nft)
      command: "rc-service {{ nft_service }} restart"
      when: _nft_ok | bool and _init == 'openrc'

    - name: Apply via service (systemd restart = nft -f rules.nft)
      service:
        name: "{{ nft_service }}"
        state: restarted
      when: _nft_ok | bool and _init == 'systemd'

    - name: Verify nft table
      command: nft list table ip forward
      register: _nft_list
      changed_when: false
      failed_when: (_nft_list.rc | default(1)) != 0
      when: _nft_ok | bool

    - name: Check service status (OpenRC)
      command: "rc-service {{ nft_service }} status"
      register: _nft_svc_status
      changed_when: false
      failed_when: false
      when: _nft_ok | bool and _init == 'openrc'

    - name: Check service status (systemd)
      command: "systemctl is-active {{ nft_service }}"
      register: _nft_svc_status
      changed_when: false
      failed_when: false
      when: _nft_ok | bool and _init == 'systemd'

    - name: Deployment summary (success)
      debug:
        msg:
          - "✅ nft port-forward applied (oneshot, reboot-safe)"
          - "  host:     {{ inventory_hostname }}"
          - "  os/init:  {{ ansible_facts['os_family'] | default('?') }} / {{ _init }}"
          - "  in_if:    {{ _nft_in_if | default('n/a') }}"
          - "  out_if:   {{ _nft_out_if | default('n/a') }}"
          - "  dir:      {{ nft_install_dir }}"
          - "  service:  {{ nft_service }}"
          - "  status:   {{ _nft_svc_status.stdout | default('n/a') | trim }}"
          - "  forwards: {{ _nft_host_forwards.keys() | list | sort }}"
          - "  note:     重启后由 {{ _init }} 自动 nft -f，无需再跑 Ansible"
      when: _nft_ok | bool

    - name: Deployment summary (soft-skipped)
      debug:
        msg:
          - "⚠️  nft port-forward soft-skipped (no capability or missing config; other hosts continue)"
          - "  host:     {{ inventory_hostname }}"
          - "  reason:   {{ _nft_skip_reason | default('unknown') }}"
      when: not (_nft_ok | bool)
