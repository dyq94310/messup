---
- name: Schedule OS update via cron
  hosts: all_nodes
  become: true
  gather_facts: false
  vars:
    ansible_connection: ssh
    ansible_become: true
    cron_hour: "9"
    cron_weekday: "1"   # Monday = 0 (Sunday) ~ 6 (Saturday)
    cron_minute: "0"
  tasks:
    - name: Detect OS and add cron job
      block:
        - name: Check OS family
          ansible.builtin.command: cat /etc/os-release
          register: os_release
          changed_when: false
          failed_when: false

        - name: Check crontab executable
          ansible.builtin.command: command -v crontab
          register: crontab_check
          changed_when: false
          failed_when: false

        - name: Install Debian cron package when missing
          ansible.builtin.apt:
            name: cron
            state: present
            update_cache: true
          when:
            - "'debian' in (os_release.stdout | lower) or 'ubuntu' in (os_release.stdout | lower)"
            - crontab_check.rc != 0

        - name: Alpine cron
          ansible.builtin.cron:
            name: "OS update"
            minute: "{{ cron_minute }}"
            hour: "{{ cron_hour }}"
            weekday: "{{ cron_weekday }}"
            job: "apk update && apk upgrade --no-cache"
            state: present
          when: "'alpine' in (os_release.stdout | lower)"
          register: result_alpine
          changed_when: result_alpine is changed

        - name: Debian cron
          ansible.builtin.cron:
            name: "OS update"
            minute: "{{ cron_minute }}"
            hour: "{{ cron_hour }}"
            weekday: "{{ cron_weekday }}"
            job: "apt update && apt upgrade -y --no-install-recommends --no-install-suggests"
            state: present
          when: "'debian' in (os_release.stdout | lower) or 'ubuntu' in (os_release.stdout | lower)"
          register: result_debian
          changed_when: result_debian is changed

        - name: Show cron result
          ansible.builtin.debug:
            msg: "Alpine cron added: {{ result_alpine.changed }}"
          when: result_alpine is defined

        - name: Show cron result
          ansible.builtin.debug:
            msg: "Debian cron added: {{ result_debian.changed }}"
          when: result_debian is defined
