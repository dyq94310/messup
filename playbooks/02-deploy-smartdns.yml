---
# 部署 / 更新 SmartDNS（二进制 + OpenRC/systemd + 按节点私有配置）
# 支持 Alpine (OpenRC) 与 Debian/Ubuntu (systemd)
- name: Deploy SmartDNS on SmartDNS nodes
  hosts: smartdns_nodes
  become: false
  gather_facts: true
  ignore_unreachable: true
  any_errors_fatal: false
  tags: [smartdns, dns]

  pre_tasks:
    - name: Resolve SmartDNS defaults path
      set_fact:
        _smartdns_defaults_src: "{{ private_config_temp }}/smartdns/vars.yml"

    - name: Check SmartDNS defaults exist on control node
      stat:
        path: "{{ _smartdns_defaults_src }}"
      delegate_to: localhost
      become: false
      register: _smartdns_defaults_stat

    - name: Fail if SmartDNS defaults are missing
      assert:
        that:
          - _smartdns_defaults_stat.stat.exists
          - _smartdns_defaults_stat.stat.isreg
        fail_msg: "❌ 找不到 SmartDNS 默认变量: {{ _smartdns_defaults_src }}"

    - name: Load SmartDNS defaults
      include_vars:
        file: "{{ _smartdns_defaults_src }}"
        name: _smartdns_defaults
      delegate_to: localhost
      become: false

    - name: Apply SmartDNS defaults
      set_fact:
        "{{ item }}": "{{ _smartdns_defaults[item] }}"
      loop:
        - smartdns_version
        - smartdns_install_dir
        - smartdns_bin
        - smartdns_config
        - smartdns_service
      when: vars[item] is not defined

    - name: Resolve private config path (shared, not per-env)
      set_fact:
        _smartdns_cfg_src: "{{ private_config_temp }}/smartdns/smartdns.conf"

    - name: Ensure private config exists on control node
      stat:
        path: "{{ _smartdns_cfg_src }}"
      delegate_to: localhost
      become: false
      register: _cfg_stat

    - name: Fail if private config missing
      assert:
        that:
          - _cfg_stat.stat.exists
          - _cfg_stat.stat.isreg
        fail_msg: >-
          ❌ 找不到 SmartDNS 全局配置: {{ _smartdns_cfg_src }}
          请确认:
            1) messup-private 已 checkout / 软链到 private-config
            2) 存在 smartdns/smartdns.conf（所有节点共用，不按环境分）

  tasks:
    - name: Detect OS / init
      ansible.builtin.include_tasks: tasks/detect_os.yml

    - name: Fail on unsupported OS
      fail:
        msg: >-
          ❌ {{ inventory_hostname }} 不支持的系统（需要 Alpine 或 Debian/Ubuntu）。
           os_family={{ ansible_facts['os_family'] | default('?') }} pkg_mgr={{ ansible_facts['pkg_mgr'] | default('?') }}
      when: _init == 'unknown'

    - name: Ensure Debian python for apt module
      ansible.builtin.include_tasks: tasks/ensure_debian_python.yml

    - name: Install runtime dependencies
      ansible.builtin.include_tasks: tasks/install_host_packages.yml
      vars:
        messup_apk_packages:
          - curl
          - tar
          - ca-certificates
          - openrc
        messup_apt_packages:
          - curl
          - tar
          - ca-certificates

    - name: Detect CPU architecture (SmartDNS release naming)
      set_fact:
        smartdns_pkg_arch: >-
          {{
            'x86_64' if ansible_facts['architecture'] in ['x86_64', 'amd64'] else
            'aarch64' if ansible_facts['architecture'] in ['aarch64', 'arm64'] else
            'arm' if ansible_facts['architecture'] in ['armv7l', 'armv7'] else
            'unknown'
          }}

    - name: Fail on unknown architecture
      fail:
        msg: >-
          ❌ 不支持的架构: {{ ansible_facts['architecture'] }}
          支持: x86_64/amd64 → x86_64, aarch64/arm64 → aarch64, armv7l → arm
      when: smartdns_pkg_arch == 'unknown'

    - name: Show target architecture
      debug:
        msg: >-
          Host {{ inventory_hostname }} os={{ ansible_facts['os_family'] | default('?') }}
          init={{ _init }} arch={{ ansible_facts['architecture'] }} → {{ smartdns_pkg_arch }}

    - name: Ensure install and runtime directories
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
        owner: root
        group: root
      loop:
        - "{{ smartdns_install_dir }}"
        - /var/log/smartdns
        - /var/cache/smartdns

    - name: Check currently installed smartdns version
      command: "{{ smartdns_bin }} -v"
      register: _installed_ver
      changed_when: false
      failed_when: false

    - name: Decide whether binary reinstall is needed
      set_fact:
        _need_bin_install: >-
          {{
            (_installed_ver.rc | default(1) != 0) or
            (smartdns_version not in (_installed_ver.stdout | default('')))
          }}

    # 官方二进制资产示例:
    # https://github.com/pymumu/smartdns/releases/download/Release48.2/smartdns-x86_64
    - name: Download SmartDNS release binary
      get_url:
        url: >-
          https://github.com/pymumu/smartdns/releases/download/Release{{ smartdns_version }}/smartdns-{{ smartdns_pkg_arch }}
        dest: "/tmp/smartdns-{{ smartdns_version }}-{{ smartdns_pkg_arch }}"
        mode: "0755"
        force: true
        timeout: 120
      register: _dl
      retries: 3
      delay: 5
      until: _dl is succeeded
      when: _need_bin_install | bool

    - name: Install smartdns binary
      copy:
        src: "/tmp/smartdns-{{ smartdns_version }}-{{ smartdns_pkg_arch }}"
        dest: "{{ smartdns_bin }}"
        remote_src: true
        mode: "0755"
        owner: root
        group: root
      when: _need_bin_install | bool
      notify: Restart smartdns

    - name: Ensure binary executable
      file:
        path: "{{ smartdns_bin }}"
        mode: "0755"
        owner: root
        group: root

    - name: Fail if binary still missing
      stat:
        path: "{{ smartdns_bin }}"
      register: _bin_stat

    - name: Assert smartdns binary present
      assert:
        that:
          - _bin_stat.stat.exists
          - _bin_stat.stat.executable
        fail_msg: "❌ smartdns 二进制不存在或不可执行: {{ smartdns_bin }}"

    - name: Deploy node-specific config from private repo
      copy:
        src: "{{ _smartdns_cfg_src }}"
        dest: "{{ smartdns_config }}"
        mode: "0644"
        owner: root
        group: root
        backup: true
      notify: Restart smartdns

    - name: Deploy service unit and ensure running
      ansible.builtin.include_tasks: tasks/deploy_service_unit.yml
      vars:
        messup_service_name: "{{ smartdns_service }}"
        messup_openrc_src: "{{ playbook_dir }}/../templates/smartdns.openrc.j2"
        messup_systemd_src: "{{ playbook_dir }}/../templates/smartdns.service.j2"
        messup_service_notify: Restart smartdns

    - name: Cleanup temporary files
      file:
        path: "/tmp/smartdns-{{ smartdns_version }}-{{ smartdns_pkg_arch }}"
        state: absent
      when: _need_bin_install | bool

    - name: Read installed version
      command: "{{ smartdns_bin }} -v"
      register: version_out
      changed_when: false
      failed_when: false

    - name: Check service status
      ansible.builtin.include_tasks: tasks/check_service_status.yml
      vars:
        messup_service_name: "{{ smartdns_service }}"

    - name: Deployment summary
      debug:
        msg:
          - "✅ SmartDNS deployed"
          - "  host:     {{ inventory_hostname }}"
          - "  os/init:  {{ ansible_facts['os_family'] | default('?') }} / {{ _init }}"
          - "  version:  {{ smartdns_version }}"
          - "  arch:     {{ smartdns_pkg_arch }}"
          - "  binary:   {{ smartdns_bin }}"
          - "  config:   {{ smartdns_config }} (src=smartdns/smartdns.conf shared)"
          - "  detail:   {{ version_out.stdout | default('n/a') | trim }}"
          - "  service:  {{ _svc_status.stdout | default('n/a') | trim }}"

  handlers:
    - name: Restart smartdns (OpenRC)
      listen: Restart smartdns
      command: "rc-service {{ smartdns_service }} restart"
      when: _init == 'openrc'

    - name: Restart smartdns (systemd)
      listen: Restart smartdns
      service:
        name: "{{ smartdns_service }}"
        state: restarted
      when: _init == 'systemd'
